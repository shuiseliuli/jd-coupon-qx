# ============================================
# Quantumult X 京东抢券 - MITM & Rewrite 配置
# ============================================
#
# 使用方法：
# 1. 复制下面 [MITM] 到 QX 的 [MITM] 部分
# 2. 复制 [rewrite_local] 到 QX 的 [rewrite_local] 部分
# 3. 手动在京东领一次券，脚本自动抓取请求参数
# 4. 抓取完成后，关闭 rewrite 规则（避免重复抓取）
# 5. 运行抢券脚本进行重放
#

[MITM]
hostname = api.m.jd.com, coupon.jd.com, api.jd.com

[rewrite_local]
# 抓包脚本 - 捕获领券请求（手动领一次券即可）
^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=(collectCoupon|receiveCoupon|getCoupon|newReceiveCoupon) url script-request-body jd_coupon_capture.js
^https:\/\/coupon\.jd\.com\/coupon\/couponReceive url script-request-body jd_coupon_capture.js
^https:\/\/api\.jd\.com\/client\.action\?functionId=(collectCoupon|receiveCoupon) url script-request-body jd_coupon_capture.js
