# ============================================
# Quantumult X 京东抢券配置
# ============================================

# ===== MITM 配置 =====
# 添加到 [MITM] 部分
hostname = api.m.jd.com, coupon.jd.com, api.jd.com

# ===== 重写规则 =====
# 添加到 [rewrite] 部分
# 用于抓包时自动记录领券请求参数
^https://api\.m\.jd\.com/client\.action\?functionId=(collectCoupon|receiveCoupon|getCoupon) url script-request-body https://raw.githubusercontent.com/shuiseliuli/jd-coupon-qx/main/jd_coupon_capture.js

^https://coupon\.jd\.com/coupon/couponReceive url script-request-body https://raw.githubusercontent.com/shuiseliuli/jd-coupon-qx/main/jd_coupon_capture.js

# ===== 定时任务（可选）=====
# 添加到 [task_local] 部分
# cron 表达式: 0 0 10 * * * 表示每天 10:00
# tag=jd_coupon_grab
